<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แผนที่แห่งหัวใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     แก้คำใบ้ + คำตอบแต่ละด่านได้ที่ตัวแปร STAGES ท้ายไฟล์ (ในแท็ก script)
     title = หัวข้อ, body = คำใบ้ที่แฟนอ่าน, answers = คำตอบที่ถูกต้อง
     image = พาธรูปภาพคำใบ้ (ถ้ามี)
     ============================================================ */
  :root {
    --parchment: #F1E6C8;
    --parchment-2: #E8D8AC;
    --ink: #3F2E1F;
    --ink-soft: #6B5842;
    --pine: #2F5233;
    --pine-deep: #1E3A22;
    --ember: #C1440E;
    --gold: #B8862B;
    --card-shadow: rgba(63, 46, 31, 0.25);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --parchment: #2A2018; --parchment-2: #332619; --ink: #F1E6C8; --ink-soft: #D9C7A0;
      --pine: #6FA87A; --pine-deep: #4C8158; --ember: #E0713C; --gold: #D9A94D;
      --card-shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --parchment: #2A2018; --parchment-2: #332619; --ink: #F1E6C8; --ink-soft: #D9C7A0;
    --pine: #6FA87A; --pine-deep: #4C8158; --ember: #E0713C; --gold: #D9A94D;
    --card-shadow: rgba(0, 0, 0, 0.5);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 15% 20%, var(--parchment-2) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, var(--parchment-2) 0%, transparent 50%);
    color: var(--ink);
    font-family: 'Prompt', system-ui, sans-serif;
    display: flex; justify-content: center;
    padding: 32px 18px 48px;
  }
  .sheet { width: 100%; max-width: 480px; }
  .compass { width: 46px; height: 46px; margin: 0 auto 10px; opacity: 0.7; }
  .eyebrow { text-align: center; color: var(--ink-soft); font-size: 0.95rem; margin-bottom: 4px; }
  h1.brand {
    font-family: 'Chonburi', serif; text-align: center; font-size: 1.5rem;
    color: var(--pine-deep); margin: 0 0 22px; line-height: 1.4;
  }
  .trail { display: flex; justify-content: center; gap: 8px; margin-bottom: 26px; flex-wrap: wrap; }
  .trail-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--parchment-2); border: 2px solid var(--ink-soft); opacity: 0.5; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
  .trail-dot.done { background: var(--pine); border-color: var(--pine); opacity: 1; }
  .trail-dot.current { background: var(--ember); border-color: var(--ember); opacity: 1; transform: scale(1.3); }
  .trail-dot.disabled { cursor: not-allowed; opacity: 0.3; }
  .trail-dot:active:not(.disabled) { transform: scale(0.85); }

  .card {
    position: relative; background: var(--parchment); border: 2px solid var(--ink);
    border-radius: 4px; padding: 30px 26px 32px; box-shadow: 6px 6px 0 var(--card-shadow);
  }
  .card::before {
    content: ""; position: absolute; inset: 8px; border: 1px dashed var(--ink-soft);
    border-radius: 2px; pointer-events: none; opacity: 0.5;
  }
  .card.shake { animation: shake 0.4s; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-8px); }
    40%, 60% { transform: translateX(8px); }
  }
  .stage-badge {
    display: inline-block; font-family: 'Chonburi', serif; font-size: 0.8rem;
    color: var(--parchment); background: var(--pine-deep); padding: 5px 14px;
    border-radius: 999px; margin-bottom: 16px;
  }
  .clue-title { font-family: 'Chonburi', serif; font-size: 1.35rem; color: var(--ember); margin: 0 0 14px; line-height: 1.4; }
  .clue-body { font-size: 1.05rem; line-height: 1.85; color: var(--ink); white-space: pre-line; margin: 0; }

  /* สไตล์รองรับรูปภาพคำใบ้ */
  .clue-image {
    width: 100%;
    max-height: 320px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid var(--ink-soft);
    margin-top: 14px;
    display: block;
  }

  .divider { display: flex; align-items: center; gap: 10px; margin: 26px 0 18px; color: var(--ink-soft); font-size: 0.85rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--ink-soft); opacity: 0.4; }

  .answer-form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .answer-input {
    width: 100%; font-family: 'Prompt', sans-serif; font-size: 1.05rem;
    padding: 13px 16px; border-radius: 10px; border: 2px solid var(--ink-soft);
    background: #FFFDF7; color: var(--ink); text-align: center;
  }
  .answer-input:focus { outline: none; border-color: var(--ember); }
  .feedback { min-height: 1.3em; font-size: 0.92rem; text-align: center; }
  .feedback.wrong { color: var(--ember); }
  .feedback.right { color: var(--pine-deep); }

  .actions { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  button, .btn {
    font-family: 'Prompt', sans-serif; font-weight: 600; font-size: 0.9rem;
    padding: 10px 18px; border-radius: 999px; border: 2px solid var(--ink);
    background: transparent; color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--pine-deep); border-color: var(--pine-deep); color: var(--parchment); }
  button.primary:active { transform: scale(0.97); }
</style>
</head>
<body>
  <div class="sheet">
    <svg class="compass" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2" style="color:var(--ink-soft)"/>
      <path d="M50 10 L58 50 L50 90 L42 50 Z" fill="var(--ember)"/>
      <path d="M10 50 L50 42 L90 50 L50 58 Z" fill="var(--ink-soft)" opacity="0.5"/>
      <circle cx="50" cy="50" r="4" fill="var(--ink)"/>
    </svg>
    <div class="eyebrow">ภารกิจล่าสมบัติ</div>
    <h1 class="brand" id="brandTitle">แผนที่แห่งหัวใจ</h1>

    <div class="trail" id="trail"></div>

    <div class="card" id="card">
      <span class="stage-badge" id="stageBadge">ด่านที่ 1</span>
      <h2 class="clue-title" id="clueTitle"></h2>
      <p class="clue-body" id="clueBody"></p>
      <img id="clueImg" class="clue-image" src="" alt="คำใบ้รูปภาพ" style="display: none;">

      <div id="answerSection">
        <div class="divider">พิมพ์คำตอบที่หาเจอ เพื่อไปด่านถัดไป</div>
        <div class="answer-form">
          <input type="text" id="answerInput" class="answer-input" placeholder="พิมพ์คำตอบตรงนี้..." autocomplete="off">
          <button class="primary" id="submitBtn">ยืนยันคำตอบ</button>
          <div class="feedback" id="feedback"></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <a class="btn" href="?stage=1" style="text-decoration:none; display:inline-flex; align-items:center;" onclick="try{localStorage.removeItem('treasureHuntStage')}catch(e){}">เริ่มใหม่</a>
    </div>
  </div>

<script>
  /* ============================================================
     แก้คำใบ้ + คำตอบแต่ละด่านตรงนี้
     - answers: ใส่ได้หลายคำ ระบบจะรับคำตอบตัวใดตัวหนึ่งในลิสต์
     - image: ใส่ชื่อไฟล์ภาพ เช่น "1.png" (ถ้าไม่มีให้ลบออกได้)
     - isFinal: true สำหรับด่านสุดท้าย (ไม่มีช่องกรอกคำตอบ)
     ============================================================ */
  const STAGES = [
    null, // ไม่ใช้ index 0
    {
      title: "ข้อที่ 1 ",
      body: "ให้เบ้บๆพิมพ์คำตอบแล้ว\nตอบถูกแล้วจะได้ไปด่านต่อไป\n\nคำถามคือ ที่ที่เราอยู่กันตอนนี้\nตอนที่เค้าเจอเบ้บตรงนี้เรากินอะไรกัน",
      answers: ["SeoulChon", "seoulchon", "โซลชอน", "ไก่โซลชอน", "โชลชอน", "โชลชอล", "โซลชอล", "โซซอล", "โซลซอน"]
    },
    {
      title: "ข้อที่ 2",
      body: "ลองสังเกตสิ่งสำคัญบริเวณนี้\nแล้วพิมพ์คำตอบเพื่อไปยังด่านถัดไป",
      image: "1.png", // <--- เพิ่มบรรทัดนี้กลับเข้ามาครับ
      answers: ["ป้าหวานใจ", "หวานใจ", "ป้าหวานเย็น", "หวานเย็น"] 
    },
    {
      title: "ข้อที่ 3",
      body: "เล่นเกมส์ให้ชนะเค้า",
      answers: ["24", "สี่สิบสี่"]
    },
    {
      title: "ข้อที่ 4",
      body: "คำถามคือเป็นสถานี N11 ชั้น 3 สีเหลือง เห็นอะไรเป็นสีเหลืองแล้วพิมพ์คำตอบลงไป",
      answers: ["Lemony", "lemony"] 
    },
    {
      title: "ภารกิจสำเร็จ 🎉",
      body: "เก่งมากๆเบ้บๆ เจอสมบัติแล้ว",
      isFinal: true
    }
  ];

  const TOTAL = STAGES.length - 1;

  function normalize(s) {
    return (s || '').trim().toLowerCase().replace(/\s+/g, '');
  }

  function getSavedStage() {
    try {
      const v = parseInt(localStorage.getItem('treasureHuntStage'), 10);
      if (v >= 1) return v;
    } catch (e) {}
    return 1;
  }

  function saveStage(n) {
    try { localStorage.setItem('treasureHuntStage', String(n)); } catch (e) {}
  }

  function getStage() {
    const p = parseInt(new URLSearchParams(window.location.search).get('stage'), 10);
    const saved = getSavedStage();
    // ถ้าผู้ใช้กรอก stage ผ่าน URL ที่เกินกว่าด่านที่เคยผ่าน ให้จำกัดไว้ที่ด่านสูงสุดที่ผ่านได้
    if (p >= 1) return Math.min(p, saved, TOTAL);
    return Math.min(saved, TOTAL);
  }

  let currentStage = getStage();
  let maxUnlockedStage = getSavedStage();

  function render() {
    const data = STAGES[currentStage];

    document.getElementById('stageBadge').textContent = data.isFinal ? 'จุดหมาย' : `ด่านที่ ${currentStage} จาก ${TOTAL}`;
    document.getElementById('clueTitle').textContent = data.title;
    document.getElementById('clueBody').textContent = data.body;
    document.getElementById('brandTitle').textContent = data.isFinal ? 'ถึงจุดหมายแล้ว' : 'แผนที่แห่งหัวใจ';

    // จัดการแสดงผลรูปภาพ
    const imgEl = document.getElementById('clueImg');
    if (data.image) {
      imgEl.src = data.image;
      imgEl.style.display = 'block';
    } else {
      imgEl.style.display = 'none';
      imgEl.src = '';
    }

    const trail = document.getElementById('trail');
    trail.innerHTML = '';
    for (let i = 1; i <= TOTAL; i += 1) {
      const dot = document.createElement('button');
      dot.type = 'button';
      
      const isDone = i < maxUnlockedStage;
      const isCurrent = i === currentStage;
      const isUnlocked = i <= maxUnlockedStage;

      dot.className = 'trail-dot' + (isDone ? ' done' : isCurrent ? ' current' : ' disabled');
      dot.setAttribute('aria-label', 'ไปด่านที่ ' + i);
      
      // อนุญาตให้กดได้เฉพาะด่านที่เคยผ่านมาแล้ว หรือด่านปัจจุบันเท่านั้น
      if (isUnlocked) {
        dot.addEventListener('click', () => goToStage(i));
      } else {
        dot.addEventListener('click', () => {
          const feedback = document.getElementById('feedback');
          feedback.textContent = 'ต้องตอบคำถามด่านนี้ให้ถูกต้องก่อนนะ!';
          feedback.className = 'feedback wrong';
          const card = document.getElementById('card');
          card.classList.remove('shake');
          void card.offsetWidth;
          card.classList.add('shake');
        });
      }
      trail.appendChild(dot);
    }

    const answerSection = document.getElementById('answerSection');
    document.getElementById('feedback').textContent = '';
    document.getElementById('feedback').className = 'feedback';

    if (data.isFinal) {
      answerSection.style.display = 'none';
      saveStage(currentStage);
    } else {
      answerSection.style.display = '';
      const input = document.getElementById('answerInput');
      input.value = '';
      setTimeout(() => input.focus(), 50);
    }
  }

  function goToStage(n) {
    if (n <= maxUnlockedStage) {
      currentStage = Math.min(n, TOTAL);
      render();
    }
  }

  function checkAnswer() {
    const data = STAGES[currentStage];
    const input = document.getElementById('answerInput');
    const feedback = document.getElementById('feedback');
    const given = normalize(input.value);

    if (!given) return;

    const isCorrect = (data.answers || []).some(a => normalize(a) === given);

    if (isCorrect) {
      feedback.textContent = 'ถูกต้อง! ✨';
      feedback.className = 'feedback right';
      setTimeout(() => {
        currentStage = Math.min(currentStage + 1, TOTAL);
        if (currentStage > maxUnlockedStage) {
          maxUnlockedStage = currentStage;
          saveStage(maxUnlockedStage);
        }
        render();
      }, 600);
    } else {
      feedback.textContent = 'ยังไม่ใช่นะ ลองอีกที';
      feedback.className = 'feedback wrong';
      const card = document.getElementById('card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  }

  document.getElementById('submitBtn').addEventListener('click', checkAnswer);
  document.getElementById('answerInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') checkAnswer();
  });

  render();
</script>
</body>
</html>
